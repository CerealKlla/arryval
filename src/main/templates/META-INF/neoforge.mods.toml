license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory

description='''
New-player onboarding: first login places the player in a private tutorial Wyrld
with a scripted NPC teaching the basics, then a starting-settlement picker binds
their Recallcinite Totem to a vacant plot in one of the real settlements nearest
world origin.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Nuclyus is the suite's foundation mod -- required for every mod, and this mod's tutorial NPC
# calls api.Nuclyus#speak directly for guaranteed, non-LLM-improvised TTS.
[[dependencies.${mod_id}]]
    modId="nuclyus"
    type="required"
    reason="Foundation mod for shared base classes/contracts; also provides the TTS client the tutorial NPC speaks through."
    ordering="AFTER"
    side="BOTH"

# TinyWyrlds spawns the private per-player tutorial Wyrld and provides the exit-portal hook this
# mod listens for -- no meaningful fallback without it.
[[dependencies.${mod_id}]]
    modId="tinywyrlds"
    type="required"
    reason="Spawns the private per-player tutorial Wyrld instance and its exit portal."
    ordering="AFTER"
    side="BOTH"

# Cartographyr resolves the real settlements nearest world origin for the starting-town picker.
[[dependencies.${mod_id}]]
    modId="cartographyr"
    type="required"
    reason="Resolves the real settlements nearest world origin for the starting-town picker."
    ordering="AFTER"
    side="BOTH"

# Settlemynts resolves/assigns a vacant plot in the chosen starting settlement.
[[dependencies.${mod_id}]]
    modId="settlemynts"
    type="required"
    reason="Resolves and assigns a vacant plot in the player's chosen starting settlement."
    ordering="AFTER"
    side="BOTH"

# Lyfe binds the new player's Recallcinite Totem to the assigned plot.
[[dependencies.${mod_id}]]
    modId="lyfe"
    type="required"
    reason="Binds the new player's Recallcinite Totem to the assigned starting plot."
    ordering="AFTER"
    side="BOTH"

# Audyble -- the tutorial guide is a real conversational NPC through Audyble's own
# Whisper->Ollama->Kokoro pipeline.
[[dependencies.${mod_id}]]
    modId="audyble"
    type="required"
    reason="The tutorial guide is a real conversational NPC through Audyble's own pipeline."
    ordering="AFTER"
    side="BOTH"

# Myssions -- the tutorial assigns a real quest with gameplay-teaching milestones.
[[dependencies.${mod_id}]]
    modId="myssions"
    type="required"
    reason="The tutorial assigns a real quest with gameplay-teaching milestones."
    ordering="AFTER"
    side="BOTH"

# Terrytories -- fires the generic ReputationHooks this mod subscribes to for the "first time ever
# Friendly with a natural settlement" mayor's-letter rule.
[[dependencies.${mod_id}]]
    modId="terrytories"
    type="required"
    reason="Fires the reputation standing-changed hook behind the mayor's-letter rule."
    ordering="AFTER"
    side="BOTH"

# Coryspondance -- sends the mayor's letter through its mail API.
[[dependencies.${mod_id}]]
    modId="coryspondance"
    type="required"
    reason="Sends the mayor's letter through its mail API."
    ordering="AFTER"
    side="BOTH"
